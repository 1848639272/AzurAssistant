name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AzurAssistant/AzurAssistant.csproj

      - name: Build
        run: dotnet build AzurAssistant/AzurAssistant.csproj -c Release --no-restore -warnaserror

      - name: Regression tests (offline, no game required)
        run: dotnet run --project tests/RegressionTests -c Release
